name: Feature request
description: Something Canopy should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. A sketch or a screenshot helps.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: A workaround, or another app that already does this well.
