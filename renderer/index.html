<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canopy</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <style>html,body{margin:0;background:#ffffff}html.dark,html.dark body{background:#181715}html[data-style=default],html[data-style=default] body{background:#fbfaf7}html[data-style=default].dark,html[data-style=default].dark body{background:#1f1f1f}html[data-vibrancy][data-style=notebook],html[data-vibrancy][data-style=notebook] body{background:transparent}#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}#boot svg{width:40px;height:40px;color:#2a8450}html.dark #boot svg{color:oklch(.72 .14 150)}.grow path{transform-box:fill-box;transform-origin:50% 100%;animation:tier-in .6s cubic-bezier(.22,1,.36,1) both,tier-wave 2.6s ease-in-out infinite;animation-delay:calc(var(--t0,0ms) + var(--in)),calc(var(--t0,0ms) + var(--wave))}.grow path:nth-child(3){--in:0s;--wave:.8s}.grow path:nth-child(2){--in:.13s;--wave:1s}.grow path:nth-child(1){--in:.26s;--wave:1.2s}@keyframes tier-in{from{opacity:0;transform:translateY(22%) scale(.8)}}@keyframes tier-wave{0%,100%{opacity:1}50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.grow path{animation:none}}</style>
    <script>
      // Match the Mac's light/dark setting, live.
      const mq = matchMedia('(prefers-color-scheme: dark)');
      window.__applyTheme = () => {
        const pref = localStorage.getItem('canopy.theme') || 'system';
        document.documentElement.classList.toggle('dark', pref === 'dark' || (pref === 'system' && mq.matches));
        window.canopy?.setTheme?.(pref); // native vibrancy follows Canopy's theme, not the OS
      };
      document.documentElement.dataset.style = 'notebook';
      // Set by the main process on macOS, where the window is an NSVisualEffectView (see src/main.mjs).
      if (new URLSearchParams(location.search).get('vibrancy') === '1') document.documentElement.dataset.vibrancy = '';
      window.__applyTheme(); mq.addEventListener('change', window.__applyTheme);
      // Dev safety net: on restart the UI can be rebuilt while it's loading, so a code file it asks for may be
      // gone ("Failed to fetch dynamically imported module"). Reload once instead of sitting on a blank window.
      (() => {
        const stale = (m) => /dynamically imported module|Importing a module script failed|error loading dynamically imported/i.test(String(m || ''));
        const reload = () => { const k = 'canopy.boot.reload', last = +sessionStorage.getItem(k) || 0; if (Date.now() - last > 8000) { sessionStorage.setItem(k, String(Date.now())); setTimeout(() => location.reload(), 300); } };
        window.addEventListener('vite:preloadError', (e) => { e.preventDefault(); reload(); });
        window.addEventListener('unhandledrejection', (e) => { if (stale(e.reason?.message ?? e.reason)) reload(); });
        window.addEventListener('error', (e) => { if (stale(e.message) || (e.target && e.target.tagName === 'SCRIPT')) reload(); }, true);
      })();
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
